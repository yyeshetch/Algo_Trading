<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configured Jobs</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #0f0f12; color: #e4e4e7; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    .sub { color: #a1a1aa; font-size: 0.9rem; margin: 0 0 1.5rem; }
    nav { margin-bottom: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    nav a { color: #60a5fa; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
    .card { background: #18181b; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid #27272a; }
    .card h2 { margin: 0 0 0.5rem; font-size: 1rem; }
    .card p { margin: 0.35rem 0; color: #a1a1aa; font-size: 0.85rem; line-height: 1.45; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; margin-top: 0.75rem; font-size: 0.82rem; }
    .meta span { color: #d4d4d8; }
    .meta .label { color: #71717a; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; }
    .badge { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .badge-ok { background: #14532d; color: #86efac; }
    .badge-warn { background: #713f12; color: #fde68a; }
    .badge-err { background: #7f1d1d; color: #fecaca; }
    .badge-off { background: #3f3f46; color: #d4d4d8; }
    .btn { padding: 0.45rem 0.9rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; background: #3b82f6; color: white; }
    .btn:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 0.85rem; color: #a1a1aa; margin-bottom: 1rem; }
    .status.err { color: #f87171; }
    .status.ok { color: #4ade80; }
    code { background: #27272a; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">← Index Dashboard</a>
    <a href="/stocks">F&O Stock Scanner</a>
  </nav>
  <h1>Configured Jobs</h1>
  <p class="sub">Background jobs started with the dashboard server. State is persisted under <code>data/jobs/job_state.json</code>.</p>
  <div class="status" id="status">Loading jobs…</div>
  <div id="jobsList"></div>
  <script>
    const statusEl = document.getElementById('status');
    const jobsList = document.getElementById('jobsList');

    function fmt(v) {
      if (v == null || v === '') return '—';
      return String(v).replace('T', ' ').slice(0, 19);
    }

    function statusBadge(st) {
      const s = (st || '').toLowerCase();
      if (s === 'ok') return '<span class="badge badge-ok">OK</span>';
      if (s === 'skipped') return '<span class="badge badge-off">SKIPPED</span>';
      if (s === 'partial') return '<span class="badge badge-warn">PARTIAL</span>';
      if (s === 'failed' || s === 'error') return '<span class="badge badge-err">FAILED</span>';
      return '<span class="badge badge-off">IDLE</span>';
    }

    function renderJob(job) {
      const st = job.state || {};
      const enabled = job.enabled !== false;
      const results = (st.last_results || []).map(r =>
        `${r.underlying || '?'}: ${r.status}${r.strikes != null ? ` (${r.strikes} strikes)` : ''}`
      ).join(' · ') || '—';
      return `<div class="card" data-job-id="${job.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;">
          <div>
            <h2>${job.name} ${enabled ? '<span class="badge badge-ok">ENABLED</span>' : '<span class="badge badge-off">DISABLED</span>'}</h2>
            <p>${job.description || ''}</p>
            <p>Interval: <strong>${job.interval_minutes || '—'} min</strong> · Schedule: <strong>${job.schedule || 'Mon–Fri 09:15–15:30 IST'}</strong></p>
            <p>Underlyings: <strong>${(job.underlyings || []).join(', ') || '—'}</strong></p>
            <p>Storage: <code>${job.storage_path || '—'}</code></p>
          </div>
          <button class="btn btn-run" data-job="${job.id}">Run now</button>
        </div>
        <div class="meta">
          <span><span class="label">Last run</span><br>${fmt(st.last_run_at)}</span>
          <span><span class="label">Status</span><br>${statusBadge(st.last_status)}</span>
          <span><span class="label">Success</span><br>${st.success_count != null ? st.success_count : '—'} / ${st.total_count != null ? st.total_count : '—'}</span>
          <span><span class="label">Updated</span><br>${fmt(st.updated_at)}</span>
        </div>
        <p style="margin-top:0.75rem;font-size:0.82rem;color:#d4d4d8;"><strong>Last results:</strong> ${results}</p>
        ${st.skip_reason ? `<p style="color:#a1a1aa;font-size:0.82rem;">${st.skip_reason}</p>` : ''}
        ${st.last_error ? `<p style="color:#f87171;font-size:0.82rem;">Error: ${st.last_error}</p>` : ''}
      </div>`;
    }

    async function loadJobs() {
      try {
        const r = await fetch('/api/jobs');
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Failed to load jobs');
        const jobs = d.jobs || [];
        jobsList.innerHTML = jobs.map(renderJob).join('') || '<div class="card">No jobs configured.</div>';
        statusEl.textContent = `${jobs.length} job(s) configured.`;
        statusEl.className = 'status ok';
        document.querySelectorAll('.btn-run').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            statusEl.textContent = 'Running job…';
            statusEl.className = 'status';
            try {
              const rr = await fetch('/api/jobs/option-chain/run', { method: 'POST' });
              const dd = await rr.json();
              if (!rr.ok) throw new Error(dd.detail || 'Run failed');
              statusEl.textContent = dd.status === 'skipped'
                ? (dd.message || 'Skipped — outside market hours.')
                : `Job finished: ${dd.status || 'ok'}.`;
              statusEl.className = 'status ok';
              await loadJobs();
            } catch (e) {
              statusEl.textContent = 'Error: ' + e.message;
              statusEl.className = 'status err';
            } finally {
              btn.disabled = false;
            }
          });
        });
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
        statusEl.className = 'status err';
      }
    }

    loadJobs();
    setInterval(loadJobs, 30000);
  </script>
</body>
</html>
